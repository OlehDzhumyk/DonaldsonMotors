# Runs the whole app: React frontend, API, PostgreSQL and a local mail catcher.
# Works without a .env file; values in .env (see .env.example) override the defaults.
services:
  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - api

  api:
    build:
      context: ./backend/DonaldsonMotors
      dockerfile: DonaldsonMotors.API/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ConnectionStrings__Default: ${DB_CONN:-Host=db;Port=5432;Database=donaldson;Username=dm_user;Password=dm_pass}
      Jwt__Key: ${JWT_KEY:-local-docker-only-jwt-signing-key-change-me-0123456789}
      Jwt__Issuer: ${JWT_ISSUER:-http://localhost:5000}
      Jwt__Audience: ${JWT_AUDIENCE:-http://localhost:5000}
      Jwt__ExpiryMinutes: ${JWT_EXPIRYMINUTES:-60}
      SeedDemoData: ${SEED_DEMO_DATA:-true}
      EmailSettings__SmtpHost: ${EmailSettings__SmtpHost:-mailpit}
      EmailSettings__SmtpPort: ${EmailSettings__SmtpPort:-1025}
      EmailSettings__SmtpUser: ${EmailSettings__SmtpUser:-}
      EmailSettings__SmtpPass: ${EmailSettings__SmtpPass:-}
      EmailSettings__UseSsl: ${EmailSettings__UseSsl:-false}
      EmailSettings__FromName: ${EmailSettings__FromName:-Donaldson Motors}
      EmailSettings__FromAddress: ${EmailSettings__FromAddress:-noreply@donaldsonmotors.local}
      EmailSettings__WebsiteUrl: ${EmailSettings__WebsiteUrl:-http://localhost:3000}
    ports:
      - "5080:8080"

  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: dm_user
      POSTGRES_PASSWORD: dm_pass
      POSTGRES_DB: donaldson
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dm_user -d donaldson"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Catches every email the API sends; open http://localhost:8025 to read them.
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"

volumes:
  db-data:

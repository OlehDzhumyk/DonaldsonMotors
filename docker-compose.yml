
services:
  # Backend API service
  api:
    build:
      # The context is now the 'backend' directory
      context: .\backend\DonaldsonMotors
      dockerfile: DonaldsonMotors.API/Dockerfile
    depends_on:
      - db
    env_file:
      - .env
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
      ASPNETCORE_URLS: "http://+:80"
      ConnectionStrings__Default: ${DB_CONN}
      Jwt__Key: ${JWT_KEY}
      Jwt__Issuer: ${JWT_ISSUER}
      Jwt__Audience: ${JWT_AUDIENCE}
      Jwt__ExpiryMinutes: ${JWT_EXPIRYMINUTES}
      EmailSettings__SmtpHost: ${EmailSettings__SmtpHost}
      EmailSettings__SmtpPort: ${EmailSettings__SmtpPort}
      EmailSettings__SmtpUser: ${EmailSettings__SmtpUser}
      EmailSettings__SmtpPass: ${EmailSettings__SmtpPass}
      EmailSettings__FromName: ${EmailSettings__FromName}
      EmailSettings__FromAddress: ${EmailSettings__FromAddress}
    ports:
      # Expose backend on host port 5000, mapping to container port 80
      - "5000:80"

#  # Frontend React App service
#  frontend:
#    build:
#      # The context is the 'frontend' directory
#      context: ./frontend
#      dockerfile: Dockerfile
#    ports:
#      # Expose frontend on host port 3000, mapping to container port 80
#      - "3000:80"
#    depends_on:
#      # This ensures the API container is started before the frontend
#      - api

  # Database service
  db:
    image: postgres:latest
    restart: always
    environment:
      POSTGRES_USER: dm_user
      POSTGRES_PASSWORD: dm_pass
      POSTGRES_DB: donaldson
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data

volumes:
  db-data:
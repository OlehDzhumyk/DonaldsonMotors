version: "3.9"
services:
  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: dm_user
      POSTGRES_PASSWORD: dm_pass
      POSTGRES_DB: donaldson
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  api:
    build:
      context: ./DonaldsonMotors.API
      dockerfile: Dockerfile
    depends_on:
      - db
    env_file:
      - .env
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
      ConnectionStrings__Default: ${DB_CONN}
      Jwt__Key: ${JWT_KEY}
    ports:
      - "5000:80"

volumes:
  db-data:
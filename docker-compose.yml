
services:

  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER:     dm_user
      POSTGRES_PASSWORD: dm_pass
      POSTGRES_DB:       donaldson
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  api:
    build:
      context: ./DonaldsonMotors.API
      dockerfile: Dockerfile
    depends_on:
      - db
    # load .env in root of this compose file
    env_file:
      - .env
    environment:
      # ASP.NET Core environment
      ASPNETCORE_ENVIRONMENT:      ${ASPNETCORE_ENVIRONMENT}

      # EF Core/Postgres connection
      ConnectionStrings__Default:  ${DB_CONN}

      # JWT settings
      Jwt__Key:            ${JWT_KEY}
      Jwt__Issuer:         ${JWT_ISSUER}
      Jwt__Audience:       ${JWT_AUDIENCE}
      Jwt__ExpiryMinutes:  ${JWT_EXPIRYMINUTES}

      # Tell Kestrel to listen on both HTTP and HTTPS
      ASPNETCORE_URLS:     "http://+:80"
    ports:
      - "5000:80"    # HTTP
      # - "5001:8081" # HTTPS

volumes:
  db-data:
# Nginx server configuration
server {
    # Listen on port 80, the default HTTP port inside the container
    listen 80;

    # Location for serving the main application files (HTML, CSS, JS)
    location / {
        # The root directory where our static files are located
        root /usr/share/nginx/html;
        # The default file to serve
        index index.html;
        # This is key for a Single Page Application (SPA).
        # It ensures that any direct navigation to a route like /my-bookings
        # is handled by React Router instead of resulting in a 404 error.
        try_files $uri $uri/ /index.html;
    }

    # Location for proxying API requests
    # Any request made from the frontend to a URL starting with /api/
    # will be forwarded to our backend service.
    location /api/ {
        # 'api' is the name of your backend service in docker-compose.yml.
        # Docker's internal DNS resolves this to the backend container's IP.
        proxy_pass http://api;

        # These headers are important for passing along the original request info
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}